name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # No PyPI publish: the `async-bash-mcp` distribution name belongs to
      # upstream xhuw/async-bash-mcp, so `uv publish` from this fork can only
      # fail with a permission error. This fork is consumed from git
      # (`uv sync` of a checkout) -- see deploy/README.md. If publishing ever
      # becomes desirable, rename the distribution first and restore an
      # OIDC/token-based publish step here.
