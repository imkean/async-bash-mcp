name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: python 3.13
    # Pinned rather than ubuntu-latest: the label moves to a new Ubuntu release
    # on its own schedule, and this fork must keep working unattended.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check

      - name: No hardcoded checkout paths
        # The systemd unit is a template rendered by deploy/install.sh, so no
        # tracked file may encode a home directory or checkout location. The
        # pathspec excludes this file, which contains the pattern itself.
        run: |
          if git grep -n -I -E '~/[A-Za-z]|/home/[^/ ]+/|/Users/[^/ ]+/' -- . ':!.github/workflows/test.yaml'; then
            echo "::error::hardcoded home/checkout path; use @REPO@ or a placeholder"
            exit 1
          fi

      - name: Run tests
        # Includes the stdio and streamable HTTP end-to-end tests.
        run: uv run pytest
