[project]
name = "async-bash-mcp"
version = "0.2.0"
description = "A robust subprocess execution MCP"
readme = "README.md"
homepage = "https://github.com/xhuw/async-bash-mcp"
authors = [
    { name = "Huw Percival", email = "huw.percival@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2,<3",
    "platformdirs>=4.3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.3.0",
    "ruff",
]

[project.scripts]
async-bash-mcp = "async_bash_mcp:main"
async_bash_mcp = "async_bash_mcp:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# A hung test should fail loudly instead of occupying a CI job until the
# runner's limit. The slowest test waits on an HTTP session teardown (10 s).
timeout = 120
